AWSTemplateFormatVersion: '2010-09-09'
Description: Next Step production infrastructure in ap-northeast-2.

Parameters:
  DomainName:
    Type: String
    Default: nextstep-plan.work
    AllowedPattern: '^[a-z0-9.-]+$'
  HostedZoneId:
    Type: String
    Description: Public hosted zone ID from dns.yml.
  CertificateArn:
    Type: String
    Description: Validated ACM certificate ARN from acm.yml in us-east-1.
  CloudFrontOriginPrefixListId:
    Type: String
    Description: Regional ID for com.amazonaws.global.cloudfront.origin-facing.
  AlarmEmail:
    Type: String
    AllowedPattern: '^[^@ ]+@[^@ ]+\.[^@ ]+$'
  GitHubRepository:
    Type: String
    Default: SANGWOO-JOO/next-step
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
  GitHubImmutableRepository:
    Type: String
    Description: GitHub OIDC immutable subject form owner@ownerId/repo@repoId (GET repos/OWNER/REPO/actions/oidc/customization/sub).
    Default: SANGWOO-JOO@97161681/next-step@1432408788
    AllowedPattern: '^[A-Za-z0-9_.-]+@[0-9]+/[A-Za-z0-9_.-]+@[0-9]+$'

  AppImageId:
    Type: AWS::EC2::Image::Id
    Description: 운영 서버 AMI를 고정한다. 최신 AMI를 그때그때 읽으면 스택 갱신 때 서버가 교체되어 DB가 사라질 수 있다.
    Default: ami-01262e2ae8cf75bdd

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.24.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: next-step-prod
        - Key: Project
          Value: next-step

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Project
          Value: next-step

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.24.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: next-step-prod-public
        - Key: Project
          Value: next-step

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Project
          Value: next-step

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: next-step

  BackupBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteBackupsAfterSevenDays
            Status: Enabled
            ExpirationInDays: 7
      Tags:
        - Key: Project
          Value: next-step

  ReleaseBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: next-step

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: next-step-prod-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nextstep/prod/*
              - Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nextstep/prod/db-password
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: NextStep/Service
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.${AWS::URLSuffix}
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub ${BackupBucket.Arn}/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BackupBucket.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${ReleaseBucket.Arn}/*
      Tags:
        - Key: Project
          Value: next-step

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow web traffic only from CloudFront origin-facing addresses.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: CloudFront origin-facing managed prefix list only
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourcePrefixListId: !Ref CloudFrontOriginPrefixListId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: next-step-prod
        - Key: Project
          Value: next-step

  AppInstance:
    Type: AWS::EC2::Instance
    DependsOn: PublicRoute
    Properties:
      ImageId: !Ref AppImageId
      InstanceType: t4g.small
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: false
          SubnetId: !Ref PublicSubnet
          GroupSet: [!Ref InstanceSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf update -y
          dnf install -y docker awscli-2 amazon-cloudwatch-agent cronie
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/download/v5.6.1/docker-compose-linux-aarch64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose
          mkdir -p /opt/next-step/deploy
          chown -R ec2-user:ec2-user /opt/next-step
          if ! aws ssm get-parameter --name /nextstep/prod/db-password --region ${AWS::Region} >/dev/null 2>&1; then
            DB_PASSWORD=$(openssl rand -hex 32)
            aws ssm put-parameter --name /nextstep/prod/db-password --type SecureString --value "$DB_PASSWORD" --region ${AWS::Region}
            unset DB_PASSWORD
          fi
          cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<'CWCONFIG'
          {
            "agent": {"metrics_collection_interval": 60, "run_as_user": "root"},
            "metrics": {
              "namespace": "CWAgent",
              "append_dimensions": {"InstanceId": "${!aws:InstanceId}"},
              "aggregation_dimensions": [["InstanceId"]],
              "metrics_collected": {
                "mem": {"measurement": ["mem_used_percent"], "metrics_collection_interval": 60},
                "disk": {"measurement": ["used_percent"], "resources": ["/"], "metrics_collection_interval": 60}
              }
            },
            "logs": {
              "logs_collected": {
                "files": {"collect_list": [{"file_path": "/var/lib/docker/containers/*/*-json.log", "log_group_name": "/next-step/prod/app", "log_stream_name": "{instance_id}", "timezone": "UTC"}]}
              }
            }
          }
          CWCONFIG
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s
          cat > /usr/local/bin/next-step-health.sh <<'HEALTHCHECK'
          #!/bin/bash
          set -euo pipefail
          if ! docker ps -a --filter label=com.docker.compose.service=app -q | grep -q .; then exit 0; fi
          TOKEN=$(curl -fsS -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600' http://169.254.169.254/latest/api/token)
          INSTANCE_ID=$(curl -fsS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
          HEALTH=0
          if curl -fsS --max-time 5 http://127.0.0.1:8080/actuator/health >/dev/null; then HEALTH=1; fi
          aws cloudwatch put-metric-data --namespace NextStep/Service --metric-name AppHealth --dimensions InstanceId=$INSTANCE_ID --value $HEALTH --unit Count --region ${AWS::Region}
          HEALTHCHECK
          chmod 0755 /usr/local/bin/next-step-health.sh
          echo '* * * * * root /usr/local/bin/next-step-health.sh' > /etc/cron.d/next-step-health
          chmod 0644 /etc/cron.d/next-step-health
          systemctl enable --now crond
      Tags:
        - Key: Name
          Value: next-step-prod
        - Key: Project
          Value: next-step

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref AppInstance
      Tags:
        - Key: Name
          Value: next-step-prod
        - Key: Project
          Value: next-step

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-s3-oac
        Description: Restrict the frontend bucket to this CloudFront distribution.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite client-side routes to index.html.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri === '/' || uri.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub ${AWS::StackName}-api-origin-policy
        Comment: Forward app cookies, OAuth query strings, CSRF headers, and viewer protocol.
        CookiesConfig:
          CookieBehavior: all
        QueryStringsConfig:
          QueryStringBehavior: all
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Accept
            - Content-Type
            - Origin
            - X-XSRF-TOKEN
            - CloudFront-Forwarded-Proto

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: AppOriginARecord
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Next Step web and API distribution.
        Aliases: [!Ref DomainName]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: app-ec2
            DomainName: !Sub origin.${DomainName}
            CustomOriginConfig:
              HTTPPort: 8080
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: app-ec2
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          - PathPattern: /oauth2/*
            TargetOriginId: app-ec2
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          - PathPattern: /login/oauth2/*
            TargetOriginId: app-ec2
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          - PathPattern: /logout
            TargetOriginId: app-ec2
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
      Tags:
        - Key: Project
          Value: next-step

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  AppOriginARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub origin.${DomainName}
      Type: A
      TTL: '60'
      ResourceRecords: [!Ref ElasticIp]

  ApexARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  ApexAAAARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: next-step-prod-alarms
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail
      Tags:
        - Key: Project
          Value: next-step

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /next-step/prod/app
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: next-step

  InstanceStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: next-step-prod-instance-status
      AlarmDescription: EC2 system or instance status check failed.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions:
        - Name: InstanceId
          Value: !Ref AppInstance
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmTopic
        - !Sub arn:${AWS::Partition}:automate:${AWS::Region}:ec2:recover
      OKActions: [!Ref AlarmTopic]
      TreatMissingData: notBreaching

  AppHealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: next-step-prod-app-health
      AlarmDescription: The Spring Boot health endpoint failed twice in a row.
      Namespace: NextStep/Service
      MetricName: AppHealth
      Dimensions:
        - Name: InstanceId
          Value: !Ref AppInstance
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]
      TreatMissingData: notBreaching

  MemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: next-step-prod-memory
      AlarmDescription: Memory usage is above 90 percent.
      Namespace: CWAgent
      MetricName: mem_used_percent
      Dimensions:
        - Name: InstanceId
          Value: !Ref AppInstance
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlarmTopic]
      TreatMissingData: notBreaching

  DiskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: next-step-prod-disk
      AlarmDescription: Root filesystem usage is above 80 percent.
      Namespace: CWAgent
      MetricName: disk_used_percent
      Dimensions:
        - Name: InstanceId
          Value: !Ref AppInstance
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlarmTopic]
      TreatMissingData: notBreaching

  CpuCreditAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: next-step-prod-cpu-credit
      AlarmDescription: CPU credit balance is running low.
      Namespace: AWS/EC2
      MetricName: CPUCreditBalance
      Dimensions:
        - Name: InstanceId
          Value: !Ref AppInstance
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 20
      ComparisonOperator: LessThanThreshold
      AlarmActions: [!Ref AlarmTopic]
      TreatMissingData: notBreaching

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - Key: Project
          Value: next-step

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: next-step-github-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # 2026년부터 GitHub는 이름이 바뀌어도 변하지 않는 sub(owner@id/repo@id)를 보낸다. 두 형식을 모두 허용한다
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepository}:ref:refs/tags/v*
                  - !Sub repo:${GitHubImmutableRepository}:ref:refs/tags/v*
      Policies:
        - PolicyName: next-step-release-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource:
                  - !GetAtt FrontendBucket.Arn
                  - !GetAtt ReleaseBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub ${FrontendBucket.Arn}/*
                  - !Sub ${ReleaseBucket.Arn}/*
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/Project: next-step
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: '*'
      Tags:
        - Key: Project
          Value: next-step

Outputs:
  DomainName:
    Value: !Ref DomainName
  CloudFrontDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
  FrontendBucketName:
    Value: !Ref FrontendBucket
  BackupBucketName:
    Value: !Ref BackupBucket
  ReleaseBucketName:
    Value: !Ref ReleaseBucket
  InstanceId:
    Value: !Ref AppInstance
  InstancePublicIp:
    Value: !Ref ElasticIp
  SsmParameterPrefix:
    Value: /nextstep/prod/
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  AlarmTopicArn:
    Value: !Ref AlarmTopic
