spring:
  application:
    name: job-scheduler
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobscheduler}
    username: ${DB_USERNAME:jobscheduler}
    password: ${DB_PASSWORD:jobscheduler}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  zone: Asia/Seoul
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
