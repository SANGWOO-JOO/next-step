spring:
  application:
    name: job-scheduler
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobscheduler}
    username: ${DB_USERNAME:jobscheduler}
    password: ${DB_PASSWORD:jobscheduler}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            # 구글 클라이언트 ID·시크릿은 환경 변수로만(docs/design.md 11-6 2-1). 없으면 로그인만 실패한다
            client-id: ${GOOGLE_CLIENT_ID:missing}
            client-secret: ${GOOGLE_CLIENT_SECRET:missing}
            scope: openid,profile,email
  session:
    # 세션은 PostgreSQL에 저장해 재시작, 배포에도 로그인 유지(docs/deploy.md 4장). 테이블은 Flyway가 만든다
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */30 * * * *"
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    session:
      # 로그인 유지 14일, 쓸 때마다 연장
      timeout: 14d
      cookie:
        same-site: lax
        http-only: true

app:
  zone: Asia/Seoul
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
