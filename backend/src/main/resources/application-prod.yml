# 운영 전용(SPRING_PROFILES_ACTIVE=prod). docs/deploy.md 4장.
# 비밀값과 주소는 기본값 없이 받는다. 빠지면 서버가 켜지지 않아 로컬 기본값으로 운영이 뜨는 일을 막는다
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # 프록시 뒤에서 http 주소로 만들어지지 않게 돌아올 주소를 고정한다
            redirect-uri: ${APP_BASE_URL}/login/oauth2/code/{registrationId}

server:
  # CloudFront → EC2. 원래 요청이 https인지는 CloudFront-Forwarded-Proto로 안다(X-Forwarded-Proto는 CloudFront가 붙일 수 없음).
  # 모든 프록시를 믿으므로 EC2 보안 그룹은 CloudFront에서 오는 요청만 열어야 한다(6단계)
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ".*"
      protocol-header: CloudFront-Forwarded-Proto
      remote-ip-header: X-Forwarded-For
  servlet:
    session:
      cookie:
        secure: true
  error:
    include-stacktrace: never
    include-message: never

app:
  cors:
    allowed-origins: ${APP_BASE_URL}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
